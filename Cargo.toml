[package]
name = "clipboard-typer"
version = "0.1.0"
edition = "2024"
description = "Windows tray utility that types clipboard text with simulated keystrokes"
license = "Proprietary"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.31"
